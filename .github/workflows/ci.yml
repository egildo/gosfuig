name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build library
        run: npm run build

      - name: Build studio
        run: npm run studio:build

      - name: CLI smoke test — plain JSON config, with an export block
        run: |
          node dist/bin.js examples/palette.config.json -o /tmp/gosfuig-json
          node -e "
            const t = require('/tmp/gosfuig-json/tokens.json');
            if (!t.color?.brand?.['500']) throw new Error('export block was not applied');
          "

      - name: CLI smoke test — module config, resolved by package self-reference
        run: node dist/bin.js examples/palette.config.mjs -o /tmp/gosfuig-mjs

      - name: CLI smoke test — --emit-config freezes a module config to JSON, and it round-trips
        run: |
          node dist/bin.js examples/palette.config.mjs -o /tmp/gosfuig-rt --emit-config --no-dashboard
          node dist/bin.js /tmp/gosfuig-rt/palette.config.json -o /tmp/gosfuig-rt2 --no-dashboard
          diff /tmp/gosfuig-rt/tokens.json /tmp/gosfuig-rt2/tokens.json

      - name: CLI smoke test — a template applies, then resolves away
        run: |
          node dist/bin.js --templates
          node dist/bin.js examples/brand.config.json -o /tmp/gosfuig-t1 \
            --template contrast --emit-config --no-dashboard
          # The emitted config must stand alone: same tokens without --template.
          node dist/bin.js /tmp/gosfuig-t1/palette.config.json -o /tmp/gosfuig-t2 --no-dashboard
          diff /tmp/gosfuig-t1/tokens.json /tmp/gosfuig-t2/tokens.json
          # Aliases land flat at the root as DTCG references into the ramp.
          node -e "
            const t = require('/tmp/gosfuig-t1/tokens.json');
            const ref = t['brand-blue']?.\$value;
            if (typeof ref !== 'string' || !ref.startsWith('{')) {
              throw new Error('expected brand-blue to be a reference, got ' + JSON.stringify(ref));
            }
            const path = ref.slice(1, -1).split('.');
            if (!path.reduce((n, k) => n?.[k], t)) throw new Error('alias points nowhere: ' + ref);
          "
          # A template that changes the step count invalidates step NAMES, and
          # that must surface as a located spec error, not an engine crash.
          if node dist/bin.js examples/brand.config.json -o /tmp/gosfuig-t3 \
               --template fine --no-dashboard 2>&1 | grep -q '16-step scale'; then
            echo "step-count mismatch reported correctly"
          else
            echo "expected a located error about the 16-step scale" >&2
            exit 1
          fi

      - name: CLI smoke test — --strict exits 1 on a failing family
        run: |
          if node dist/bin.js examples/palette.config.json -o /tmp/gosfuig-strict --strict; then
            echo "expected --strict to exit 1 (the demo pins a failing brand color)" >&2
            exit 1
          fi
